services:
  nginx:
    image: nginx:1.27.0
    container_name: ddbj-search-nginx-${DDBJ_SEARCH_ENV}
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      # Mounted as a single file, not as a directory: the image ships its own
      # scripts in /docker-entrypoint.d (including the envsubst pass over
      # /etc/nginx/templates), and mounting over the directory would hide them.
      - ./nginx/docker-entrypoint.d/15-ddbj-resolver.sh:/docker-entrypoint.d/15-ddbj-resolver.sh:ro
    environment:
      TZ: ${TZ:-Asia/Tokyo}
      NGINX_ENVSUBST_FILTER: DDBJ_SEARCH
      DDBJ_SEARCH_ENV: ${DDBJ_SEARCH_ENV}
    ports:
      - ${DDBJ_SEARCH_NGINX_BIND_HOST}:${DDBJ_SEARCH_NGINX_BIND_PORT}:80
    networks:
      - ddbj-search-network
    restart: unless-stopped
    # Per-container log rotation. The journald driver keeps a single shared
    # budget across every container, so one chatty service evicts the logs of
    # all the others. "json-file" is the one driver name both Docker and
    # Podman accept.
    logging:
      driver: json-file
      options:
        max-size: "200m"
        max-file: "5"
    init: true

networks:
  ddbj-search-network:
    name: ddbj-search-network-${DDBJ_SEARCH_ENV}
    external: true
